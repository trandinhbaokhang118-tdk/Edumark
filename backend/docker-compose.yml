services:
  catalog-api:
    build: { context: ., dockerfile: src/EduMark.Api/Dockerfile }
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      Services__Notification__BaseUrl: http://notification-api:8080/
    depends_on: [notification-api]
  notification-api:
    build: { context: ., dockerfile: src/EduMark.Notification.Api/Dockerfile }
    ports: ["5090:8080"]
    environment: { ASPNETCORE_URLS: http://+:8080 }
